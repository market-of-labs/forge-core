version: 2

# 三个仓库需要这个文件（依赖在哪，升级就该配在哪）：
#   - 本仓库（`forge-core`）：build.yml 里三个 action + go.mod 依赖；
#   - `store`：forward.yml 里 `actions/github-script`（它自己那一份在
#     store/.github/dependabot.yml）；
#   - 公有的 `forge`：取执行体那个 action（`robinraju/release-downloader@v1`，
#     它自己那一份在 forge/.github/dependabot.yml）。
#
# `forge` 那边长期是"一个 `uses:` 都没有"（只跑 `gh` CLI 与它自己拉下来的二进制），
# 取件换成 action 之后才有了这第一个、也是唯一一个依赖 —— 用的是主版本标签，所以
# 那边从此也需要一份。
#
# 为什么 Dependabot 在这里不会破坏"打 tag = 上生产"：它只**开 PR**，不合并、不
# 打 tag。合并一个 PR 只改源码，线上那份二进制仍然是上一个 tag 的产物 —— 要生效
# 还是得有人显式打新 tag。所以自动化更新与发布闸门不冲突。
#
# 也**不花 Actions 分钟数**：本仓库的 workflow 只在 `push: tags: ['v*']` 触发，
# Dependabot 开的 PR 是普通 PR，跑不起来任何东西。
updates:
  # action 用的是主版本标签（`@v7` / `@v3`，见 build.yml），这个 update 就是
  # 跟新主版本用的 —— 也是"不钉 SHA"这个取舍的配套：少一道人工，多一道自动。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 两个 action 合成一个 PR，别把私有仓库的 PR 列表刷屏。
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ['*']
