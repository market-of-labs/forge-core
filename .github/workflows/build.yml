name: build

# 唯一的发布入口：**打 tag 才构建**（`v*`）。
#
# 为什么不是"push 到 main 就构建"：这个 Release 里出去的二进制，会被公开的
# `market-of-labs/forge` 拉下来、**带着能写 store 的 PAT 执行**。也就是说
# **打 tag 等于上生产**。让"每一次提交"都具备这个能力，就等于让每一次提交
# 都是生产发布；而 tag 是一个明确、可追溯、可拒绝的动作。
#
# 反过来也不给 `workflow_dispatch`：手动触发时 `GITHUB_REF_NAME` 是分支名，
# 会造出一个叫 `main` 的 Release —— 而成品又会被当成 latest 拉去执行。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# 同一时刻只允许一个发布在跑。两个 tag 同时推上来时排队，不要交错上传。
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 这个二进制是**纯 Go**（APK 元数据由 github.com/shogo82148/androidbinary
      # 解析，不需要 aapt，也没有 cgo 依赖），所以关掉 cgo 得到的是一个静态链接
      # 的产物，不挑 runner 镜像里的 glibc。写死是为了以后万一引入 cgo 依赖时
      # 它会**构建失败**，而不是悄悄产出一个在别处跑不起来的二进制。
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
      ASSET: forge-linux-amd64
    steps:
      # 这两个 action 钉到 commit SHA，而不是 `@v7`。理由与下面那道"一个 tag 一个
      # 二进制"的闸门是同一条：这个 job 的产物会被带到能写 store 的 PAT 下执行，
      # 所以"上游往 v7 这个 tag 上推了什么"必须是一个**不会自己变**的事实。SHA 是
      # 不变的，tag 不是。末尾的 `# vX.Y.Z` 注释是给 Dependabot 认版本用的。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本 job 后续不再需要 git 凭据（发布走 `gh` + `GH_TOKEN`），所以不落盘。
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # 测试放在发布**之前**，而且失败就中止。理由同上：既然打 tag 等于上生产，
      # 那么"测试没过"就该是在生产之前拦住的事，而不是事后在 Actions 日志里发现。
      # 这是本仓库唯一的一道闸门 —— 平时的提交不走 CI（私有仓库的分钟数要省着），
      # 本地 `go test ./...` 仍然是你日常的检查手段。
      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -o "$RUNNER_TEMP/$ASSET" ./cmd/forge

      # 发布。用现成的 action 而不是 `gh release view/create/upload`：老写法是 ~10 行
      # 手写 shell，而"建 Release / 传 asset"本身是没有秘密的机械动作。
      #
      # token 不写 = 吃 action 默认的 `github.token`，正是这里要的：本 job **不需要
      # PAT**（它只写自己这个仓库），与 §6.2 那条"PAT 只出现在需要它的地方"一致。
      #
      # ⚠️ 两处行为与老写法不同，是明知的取舍：
      #
      #   1. 老写法在"asset 已存在"时 `exit 1`（响亮地失败）；这里
      #      `overwrite_files: false` 是**跳过并打一行日志**（已核 v3.0.2 源码
      #      `src/github.ts:435`：返回 null，不报错）。要守的不变量 ——"一个 tag
      #      只对应一个二进制"—— **仍然成立**，它现在由"不可能覆盖"保证，而不是
      #      由"敢覆盖就报错"保证。丢掉的只是那条红色警告本身。
      #   2. 老写法在 Release 已存在时**完全不碰它**；这个 action 会顺带 PATCH 一次
      #      （name / body / generate_release_notes）。内容由 commit 区间决定，重跑
      #      结果一致，影响仅限于此。
      #
      # `fail_on_unmatched_files: true` 是**必须显式写**的：它默认 false，而默认值
      # 下"文件没找到"会**绿着**产出一个没有 asset 的 Release —— 那种"成功但空"，
      # 正是本仓库最不想要的结果。
      - name: Publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # 显式写成 github.ref_name（= 本 job 的 tag），不吃 action 的默认值：默认值
          # 恰好也是它，但"恰好相同"不是契约。
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}   # 等价于老写法的 --title "$TAG"
          generate_release_notes: true   # 等价于 --generate-notes
          # ⚠️ 默认是 true —— 那个默认值正好会毁掉"一个 tag 一个二进制"，不能吃它。
          overwrite_files: false
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/${{ env.ASSET }}
